services:
  platform-postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set in Dokploy}
    volumes:
      - platform-postgres-data:/var/lib/postgresql/data
      - ./create-project.sql:/opt/platform/create-project.sql:ro
    networks:
      - platform-internal
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 3s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 1g

volumes:
  platform-postgres-data:

networks:
  # Owned here, not external, so Postgres's first deploy creates it. Every
  # other compose file joins it with `external: true`.
  platform-internal:
    name: platform-internal
